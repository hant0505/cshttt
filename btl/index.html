<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASS - Bot-Assisted Semantic Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* LEFT PANEL - DOCUMENT LABELING */
        .left-panel {
            flex: 1;
            background: white;
            padding: 30px;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .user-info {
            font-size: 12px;
            color: #7f8c8d;
            background: #ecf0f1;
            padding: 8px 12px;
            border-radius: 4px;
            display: inline-block;
        }

        /* DOCUMENT DISPLAY */
        .document-section {
            flex: 1;
            margin-bottom: 20px;
        }

        .document-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .document-text {
            background: #f8f9fa;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            line-height: 1.6;
            min-height: 150px;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .doc-id {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 8px;
        }

        /* LLM SUGGESTIONS */
        .suggestions-section {
            margin-bottom: 20px;
        }

        .suggestions-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .suggestions-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .suggestion-btn {
            background: #e8f4f8;
            border: 1px solid #b8dce8;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .suggestion-btn:hover {
            background: #d0eef5;
            border-color: #90c4d8;
        }

        .suggestion-btn.selected {
            background: #3498db;
            color: white;
            border-color: #2980b9;
        }

        /* LABEL INPUT */
        .label-input-section {
            margin-bottom: 20px;
        }

        .label-input-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .input-group button {
            padding: 10px 16px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .input-group button:hover {
            background: #229954;
        }

        .existing-labels {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .label-tag {
            background: #f39c12;
            color: white;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .label-tag:hover {
            background: #e67e22;
        }

        /* ACTION BUTTONS */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        /* RIGHT PANEL - TOPICS & SEARCH */
        .right-panel {
            flex: 1;
            background: #fafafa;
            padding: 30px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .right-panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        /* SEARCH BOX */
        .search-section {
            margin-bottom: 25px;
        }

        .search-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 14px;
        }

        .search-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        /* TOPICS LIST */
        .topics-section {
            margin-bottom: 25px;
        }

        .topics-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .topic-tag {
            background: white;
            border: 1px solid #bdc3c7;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .topic-tag:hover {
            background: #ecf0f1;
            border-color: #3498db;
        }

        .topic-tag.active {
            background: #3498db;
            color: white;
            border-color: #2980b9;
        }

        /* DOCUMENTS TABLE */
        .documents-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .documents-section h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #ecf0f1;
            position: sticky;
            top: 0;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            color: #2c3e50;
            border-bottom: 1px solid #ddd;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ecf0f1;
            font-size: 12px;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .doc-text-preview {
            color: #7f8c8d;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* METRICS */
        .metrics-section {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .metric-card {
            text-align: center;
        }

        .metric-value {
            font-size: 20px;
            font-weight: bold;
            color: #3498db;
        }

        .metric-label {
            font-size: 11px;
            color: #7f8c8d;
            margin-top: 5px;
        }

        /* LOADING & STATUS */
        .loading {
            text-align: center;
            color: #7f8c8d;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #ecf0f1;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-message {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 13px;
        }

        .status-success {
            background: #d5f4e6;
            color: #27ae60;
            border: 1px solid #27ae60;
        }

        .status-error {
            background: #fadbd8;
            color: #c0392b;
            border: 1px solid #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="header">
                <h1>📝 Label Document</h1>
                <div class="user-info">
                    User: <span id="userId">Loading...</span> | 
                    Progress: <span id="progress">0/20</span>
                </div>
            </div>

            <div id="statusMessage"></div>

            <div class="document-section">
                <label>Current Document</label>
                <div class="document-text" id="documentText">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading document...
                    </div>
                </div>
                <div class="doc-id">Doc ID: <span id="docId">-</span></div>
            </div>

            <div class="suggestions-section">
                <label>🤖 LLM Suggestions</label>
                <div class="suggestions-list" id="suggestionsList">
                    <div class="loading">No suggestions yet</div>
                </div>
            </div>

            <div class="label-input-section">
                <label>Choose or Create Label</label>
                <div class="input-group">
                    <input type="text" id="customLabelInput" placeholder="Or type new label...">
                    <button onclick="submitCustomLabel()">Add</button>
                </div>
                <div class="existing-labels" id="existingLabels">
                    <span style="color: #7f8c8d; font-size: 12px;">No labels yet</span>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="skipDocument()">⏭ Skip</button>
                <button class="btn btn-primary" onclick="nextDocument()">✓ Next</button>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
            <h2>🔍 Topics & Search</h2>

            <div class="search-section">
                <input type="text" class="search-input" id="searchInput" 
                       placeholder="Search documents...">
            </div>

            <div class="topics-section">
                <h3>Available Topics</h3>
                <div class="topics-list" id="topicsList">
                    <span style="color: #7f8c8d; font-size: 12px;">Topics will appear here</span>
                </div>
            </div>

            <div class="documents-section">
                <h3>Labeled Documents</h3>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Label</th>
                                <th>Preview</th>
                                <th>Confidence</th>
                            </tr>
                        </thead>
                        <tbody id="documentsTable">
                            <tr>
                                <td colspan="4" style="text-align: center; color: #7f8c8d;">
                                    No documents labeled yet
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="metrics-section">
                <h3 style="margin-bottom: 10px; font-size: 13px;">📊 Metrics</h3>
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-value" id="purityValue">-</div>
                        <div class="metric-label">Purity</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="ariValue">-</div>
                        <div class="metric-label">ARI</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="nmiValue">-</div>
                        <div class="metric-label">NMI</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = 'http://localhost:5000';
        let userId = null;
        let currentDocId = null;
        let labeledDocuments = {};
        let allLabels = [];

        // Initialize
        async function init() {
            try {
                const response = await fetch(`${API_BASE}/create_user`);
                const data = await response.json();
                userId = data.user_id;
                document.getElementById('userId').textContent = userId;
                loadNextDocument();
            } catch (error) {
                showStatus('Error creating user: ' + error.message, 'error');
            }
        }

        // Load next document
        async function loadNextDocument() {
            try {
                const response = await fetch(
                    `${API_BASE}/get_recommended_document?user_id=${userId}`
                );
                const data = await response.json();
                const doc = data.data;
                
                currentDocId = doc.doc_id;
                document.getElementById('docId').textContent = currentDocId;
                document.getElementById('documentText').innerHTML = 
                    `<p>${escapeHtml(doc.text)}</p>`;
                
                // Load predictions
                loadPredictions();
                updateProgress();
            } catch (error) {
                showStatus('Error loading document: ' + error.message, 'error');
            }
        }

        // Load predictions from classifier
        async function loadPredictions() {
            try {
                const response = await fetch(
                    `${API_BASE}/predict?user_id=${userId}&doc_id=${currentDocId}`
                );
                const data = await response.json();
                const predictions = data.data.predictions;
                allLabels = data.data.all_labels;

                // Show suggestions
                let html = '';
                if (Array.isArray(predictions) && predictions.length > 0 && 
                    !predictions[0].includes('Need at least')) {
                    predictions.slice(0, 3).forEach((pred, idx) => {
                        const label = Array.isArray(pred) ? pred[0] : pred;
                        const conf = Array.isArray(pred) ? (pred[1] * 100).toFixed(1) : 'N/A';
                        html += `<button class="suggestion-btn" onclick="selectLabel('${label}')">${label} (${conf}%)</button>`;
                    });
                } else {
                    html = '<span style="color: #7f8c8d; font-size: 12px;">Label 2+ documents first</span>';
                }
                document.getElementById('suggestionsList').innerHTML = html;

                // Update existing labels
                updateExistingLabels();
            } catch (error) {
                console.error('Error loading predictions:', error);
            }
        }

        // Update existing labels display
        function updateExistingLabels() {
            const labelsHtml = allLabels.map(label => 
                `<span class="label-tag" onclick="selectLabel('${label}')">${label}</span>`
            ).join('');
            
            document.getElementById('existingLabels').innerHTML = labelsHtml || 
                '<span style="color: #7f8c8d; font-size: 12px;">No labels yet</span>';
        }

        // Select label
        async function selectLabel(label) {
            try {
                const response = await fetch(`${API_BASE}/label_document`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        doc_id: currentDocId,
                        label: label
                    })
                });
                const data = await response.json();
                labeledDocuments[currentDocId] = label;
                showStatus(`✓ Document labeled as "${label}"`, 'success');
                updateMetrics();
                updateTable();
                
                // Auto load next
                setTimeout(() => loadNextDocument(), 800);
            } catch (error) {
                showStatus('Error labeling document: ' + error.message, 'error');
            }
        }

        // Submit custom label
        async function submitCustomLabel() {
            const input = document.getElementById('customLabelInput');
            const label = input.value.trim();
            if (label) {
                input.value = '';
                await selectLabel(label);
            }
        }

        // Skip document
        async function skipDocument() {
            await loadNextDocument();
        }

        // Next document (same as skip for now)
        async function nextDocument() {
            await loadNextDocument();
        }

        // Update progress
        function updateProgress() {
            const count = Object.keys(labeledDocuments).length;
            document.getElementById('progress').textContent = `${count}/20`;
        }

        // Update metrics
        async function updateMetrics() {
            try {
                const response = await fetch(`${API_BASE}/metrics?user_id=${userId}`);
                const data = await response.json();
                const metrics = data.data;
                
                document.getElementById('purityValue').textContent = 
                    metrics.purity ? (metrics.purity * 100).toFixed(1) + '%' : '-';
                document.getElementById('ariValue').textContent = 
                    metrics.ari ? metrics.ari.toFixed(3) : '-';
                document.getElementById('nmiValue').textContent = 
                    metrics.nmi ? metrics.nmi.toFixed(3) : '-';
            } catch (error) {
                console.error('Error updating metrics:', error);
            }
        }

        // Update table
        function updateTable() {
            const tbody = document.getElementById('documentsTable');
            if (Object.keys(labeledDocuments).length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #7f8c8d;">No documents labeled yet</td></tr>';
                return;
            }

            let html = '';
            Object.entries(labeledDocuments).forEach(([docId, label]) => {
                html += `
                    <tr>
                        <td>${docId}</td>
                        <td><span class="label-tag">${label}</span></td>
                        <td class="doc-text-preview">Sample text...</td>
                        <td>-</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // Show status message
        function showStatus(message, type = 'success') {
            const elem = document.getElementById('statusMessage');
            elem.innerHTML = `<div class="status-message status-${type}">${message}</div>`;
            setTimeout(() => elem.innerHTML = '', 3000);
        }

        // Escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Start
        init();
    </script>
</body>
</html>
